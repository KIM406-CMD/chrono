spring:
  datasource:
    url: jdbc:mysql://prod-host:3306/chrono_bbs_prod?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:chrono}
    password: ${DB_PASSWORD:chrono123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:prod-host}
      port: ${REDIS_PORT:6379}
  elasticsearch:
    uris: ${ES_URIS:http://prod-host:9200}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:chrono-bbs}