server:
  port: 8080

spring:
  profiles:
    active: dev

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true
  group-configs:
    - group: default
      display-name: default
      paths-to-match: /**
      packages-to-scan: com.ncist.controller

knife4j:
  enable: true
  setting:
    language: zh_cn