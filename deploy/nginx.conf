# ============================================================
# 网上超市系统 — 前端静态站点 + 后端接口反向代理
#
# 使用方式：
#   1. npm run build
#   2. 将 chrono-bbs-client/dist/ 下的内容部署到 root 指定目录
#   3. 将本文件放入 Nginx 配置目录并 reload
#
# 说明：
#   - 前端使用 History 路由，必须保留 try_files 回退到 index.html
#   - /api/ 反向代理到后端服务；若 Nginx 在容器中运行，
#     请将 127.0.0.1 改为 host.docker.internal 或后端服务名
# ============================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 商品图片单张限制 2MB、请求总大小 10MB，留出余量
    client_max_body_size 10m;

    # 文本资源压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # History 路由回退：刷新 /product/1 等页面不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 带哈希的构建产物可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 聊天 WebSocket：与后端原生端点 /chat/{userId} 对应
    location /chat/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
