# ============================================================
# 网上超市系统 — 本地开发中间件编排
#
# 启动中间件：cd docker && docker compose up -d
# 启动前端：   cd docker && docker compose --profile frontend up -d --build nginx
# 停止：       docker compose down
# 重置数据：   docker compose down -v（会删除 MySQL/Redis/ES 数据卷）
#
# MySQL 首次创建数据卷时会按顺序执行 ../initial 下的脚本：
#   01-schema.sql    —— schema.sql，建库建表（20 张表）
#   02-data.sql      —— data.sql，初始数据（管理员、分类、规格、秒杀券）
#   03-migration.sql —— migration-2026-11-09.sql，增量字段（可重复执行）
#   04-demo-data.sql —— demo-data.sql，演示商家/商品/订单/评论（可重复执行）
#   05-rename.sql    —— rename-products.sql，商品名称/品牌/分类与图片对齐（可重复执行）
# 注意：初始化脚本只在数据卷为空时执行；修改脚本后需 down -v 再启动。
# 已有数据卷升级：手动执行 initial/migration-*.sql，无需删除数据卷。
# ============================================================
services:

  # ==================== MySQL 8.0 ====================
  mysql:
    image: mysql:8.0
    container_name: chrono-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: chrono_bbs_dev
      MYSQL_USER: chrono
      MYSQL_PASSWORD: chrono123
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3307 → 容器 3306，避免与本机 MySQL 的 3306 冲突
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 复用仓库根目录 initial/ 下的脚本，避免维护重复副本
      - ../initial/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../initial/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ../initial/migration-2026-11-09.sql:/docker-entrypoint-initdb.d/03-migration.sql:ro
      - ../initial/demo-data.sql:/docker-entrypoint-initdb.d/04-demo-data.sql:ro
      - ../initial/rename-products.sql:/docker-entrypoint-initdb.d/05-rename-products.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== Redis 7 ====================
  redis:
    image: redis:7
    container_name: chrono-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================== Elasticsearch 8.x ====================
  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: chrono-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # ==================== 前端 Nginx（可选） ====================
  # 启用：docker compose --profile frontend up -d --build nginx
  # 默认端口 3000，可通过 FRONTEND_PORT 环境变量覆盖
  # 后端仍运行在宿主机 8080，容器通过 host.docker.internal 访问
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP_VERSION: "1.1.0"
    container_name: chrono-nginx
    restart: unless-stopped
    profiles: ["frontend"]
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    extra_hosts:
      # Linux 上让 host.docker.internal 指向宿主机
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
  redis-data:
  es-data:
