# ============================================================
# 网上超市系统 — 本地开发中间件编排
#
# 启动：cd docker && docker compose up -d
# 停止：docker compose down
# 重置数据：docker compose down -v（会删除 MySQL/Redis/ES 数据卷）
#
# MySQL 首次创建数据卷时会自动执行 ./sql 下的初始化脚本：
#   01-schema.sql —— 建库建表（20 张表）
#   02-data.sql   —— 初始数据（管理员、分类、规格、秒杀券）
# 注意：初始化脚本只在数据卷为空时执行；修改脚本后需 down -v 再启动。
# ============================================================
services:

  # ==================== MySQL 8.0 ====================
  mysql:
    image: mysql:8.0
    container_name: chrono-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: chrono_bbs_dev
      MYSQL_USER: chrono
      MYSQL_PASSWORD: chrono123
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3307 → 容器 3306，避免与本机 MySQL 的 3306 冲突
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== Redis 7 ====================
  redis:
    image: redis:7
    container_name: chrono-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================== Elasticsearch 8.x ====================
  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: chrono-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

volumes:
  mysql-data:
  redis-data:
  es-data:
